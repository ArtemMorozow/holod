[package]
name = "holod"
version = "0.1.3"
edition = "2024"
publish = false

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std", "block2", "libc", "objc2-core-foundation", "NSAccessibilityProtocols",
    "NSAlert", "NSApplication", "NSBox", "NSButton", "NSCell", "NSColor", "NSControl", "NSEvent",
    "NSFont", "NSFontDescriptor", "NSGlassEffectView", "NSGraphics", "NSImage", "NSImageView",
    "NSMenu", "NSMenuItem", "NSPanel", "NSParagraphStyle", "NSResponder", "NSRunningApplication", "NSScrollView",
    "NSStatusBar", "NSStatusBarButton", "NSStatusItem",
    "NSTableColumn", "NSTableHeaderView", "NSTableView", "NSText", "NSTextField",
    "NSTextView", "NSUserInterfaceItemIdentification", "NSView", "NSWindow", "NSWorkspace",
] }
objc2-application-services = { version = "0.3", default-features = false, features = ["std", "libc", "HIServices", "AXError", "AXUIElement", "AXValue"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFNumber", "CFRunLoop", "CFString", "CFCGTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std", "block2", "NSArray", "NSBundle", "NSData", "NSDate", "NSDictionary", "NSIndexSet",
    "NSNotification", "NSObject", "NSOperation", "NSString", "NSURL", "NSUserDefaults",
] }
