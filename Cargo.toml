[package]
name = "window-switcher"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"
global-hotkey = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std", "libc", "objc2-core-foundation", "NSApplication", "NSCell", "NSColor", "NSControl",
    "NSFont", "NSGraphics", "NSPanel", "NSParagraphStyle", "NSResponder", "NSRunningApplication", "NSScrollView",
    "NSTableColumn", "NSTableHeaderView", "NSTableView", "NSText", "NSTextField",
    "NSTextView", "NSUserInterfaceItemIdentification", "NSView", "NSWindow", "NSWorkspace",
] }
objc2-application-services = { version = "0.3", default-features = false, features = ["std", "libc", "HIServices", "AXError", "AXUIElement", "AXValue"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFNumber", "CFString", "CFCGTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std", "NSArray", "NSDate", "NSIndexSet", "NSNotification", "NSObject", "NSString",
] }
