stages:
  - build
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

variables:
  MACOS_RUNNER_TAG: saas-macos-medium-m1

.macos:
  image: macos-26-xcode-26
  tags:
    - $MACOS_RUNNER_TAG
  before_script:
    - test "$(uname -sm)" = 'Darwin arm64'
    - export PATH="$HOME/.cargo/bin:$PATH"
    - |
      if ! command -v rustup >/dev/null; then
        curl --fail --silent --show-error --location https://sh.rustup.rs -o rustup-init.sh
        sh rustup-init.sh -y --profile minimal --default-toolchain none --no-modify-path
        rm rustup-init.sh
      fi
    - rustup toolchain install stable --profile minimal --component rustfmt --component clippy
    - export RUSTUP_TOOLCHAIN=stable
    - rustup target add aarch64-apple-darwin

build_macos:
  extends: .macos
  stage: build
  interruptible: true
  rules:
    - when: on_success
  script:
    - cargo fmt --check
    - cargo check --locked
    - cargo clippy --locked --all-targets -- -D warnings
    - cargo test --locked
    - ./packaging/macos/build.sh
  artifacts:
    paths:
      - dist/*.dmg
    expire_in: 1 week

publish_macos:
  extends: .macos
  stage: deploy
  needs:
    - job: build_macos
      artifacts: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $CI_COMMIT_REF_PROTECTED == "true"'
  resource_group: holod-release
  environment:
    name: production
    url: $CI_PAGES_URL
  timeout: 1h
  script:
    - bash packaging/macos/release.sh
  pages: true
